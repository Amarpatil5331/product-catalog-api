
name: Product Catalog CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: product_catalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1. Download source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build the application and run tests
      - name: Build with Maven
        run: mvn --batch-mode clean package
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/product_catalog
          DB_USERNAME: root
          DB_PASSWORD: '123456'

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t product-catalog-api:ci \
            -t product-catalog-api:${GITHUB_SHA::7} \
            .

      # 5. Verify Docker image
      - name: Verify Docker image
        run: docker image ls product-catalog-api

      # 6. Authenticate to AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 7. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 8. Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Tag image for ECR
      - name: Tag Docker image for ECR
        env:
          ECR_URI: 650126343372.dkr.ecr.ap-south-1.amazonaws.com/product-catalog-api
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker tag product-catalog-api:ci "$ECR_URI:$IMAGE_TAG"

      # 10. Push image to ECR
      - name: Push Docker image to ECR
        env:
          ECR_URI: 650126343372.dkr.ecr.ap-south-1.amazonaws.com/product-catalog-api
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker push "$ECR_URI:$IMAGE_TAG"
