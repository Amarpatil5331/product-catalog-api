name: Product Catalog CI

on:
  push:
    branches:
      - 'feature/**'
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: product_catalog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/product_catalog
          DB_USERNAME: root
          DB_PASSWORD: 123456

      - name: Build Docker image
        run: |
          docker build \
            -t product-catalog-api:ci \
            -t product-catalog-api:${GITHUB_SHA::7} \
            .

      - name: Verify Docker image
        run: docker image ls product-catalog-api
