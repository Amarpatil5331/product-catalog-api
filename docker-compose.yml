services:
  product-catalog-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: product-catalog-api

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    restart: unless-stopped
